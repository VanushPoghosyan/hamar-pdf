<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Համար → PDF</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 10%, #1a3a5c 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, #1a2f24 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .wrap {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid #2a3542;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 650;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .actions {
      display: grid;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn.secondary {
      background: #2a3542;
      color: var(--text);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: none;
    }
    input[type="file"] { display: none; }
    .status {
      margin-top: 18px;
      min-height: 1.4em;
      font-size: 0.92rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .preview {
      margin-top: 16px;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
      text-align: left;
    }
    .preview.show { display: grid; }
    .preview figure {
      margin: 0;
      border: 1px solid #2a3542;
      border-radius: 8px;
      overflow: hidden;
      background: #121820;
    }
    .preview img {
      display: block;
      width: 100%;
      height: 72px;
      object-fit: cover;
    }
    .preview figcaption {
      padding: 4px 6px;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Фото → PDF <small style="color:#8b9aab;font-weight:500">v4</small></h1>
    <p>
      Выбери сразу много фото հարկային հաշիվ — на каждое скачается
      <b>свой отдельный</b> PDF (<code>0723.pdf</code>, <code>0523.pdf</code>…).
      Если браузер спросит «разрешить несколько файлов» — нажми <b>Разрешить</b>.
    </p>
    <div class="actions">
      <button class="btn" id="pickBtn" type="button">Выбрать фото</button>
      <button class="btn secondary" id="makeBtn" type="button" disabled>Сделать PDF</button>
    </div>
    <input id="file" type="file" accept="image/*" multiple />
    <div class="preview" id="preview"></div>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="./app.js?v=4"></script>
</body>
</html>
