<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Համար → PDF</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 10%, #1a3a5c 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, #1a2f24 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .wrap {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid #2a3542;
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 650;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: none;
    }
    input[type="file"] { display: none; }
    .status {
      margin-top: 18px;
      min-height: 1.4em;
      font-size: 0.92rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .preview {
      margin-top: 16px;
      max-height: 220px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a3542;
      display: none;
    }
    .preview img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Фото → PDF</h1>
    <p>Загрузи фото հարկային հաշիվ. PDF назовётся по последним 4 цифрам поля <b>Համար</b> (например <code>2815.pdf</code>).</p>
    <button class="btn" id="pickBtn" type="button">Загрузить фото</button>
    <input id="file" type="file" accept="image/*" />
    <div class="preview" id="preview"><img id="previewImg" alt="preview" /></div>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
